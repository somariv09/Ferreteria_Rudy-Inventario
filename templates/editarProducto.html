
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Producto - Ferretería Rudy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="pagina">

    <header class="parte-superior">
        <div class="contenido-superior">

            <a href="{% url 'dashboard' %}" class="marca-ferreteria text-decoration-none text-white">
                <i class="bi bi-tools"></i>
                <span>FERRETERÍA RUDY</span>
            </a>

            <div class="usuario-sesion">
                <i class="bi bi-person-circle"></i>
                <span>{{ request.user.nombre }}</span>

                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="cerrar-sesion" title="Cerrar Sesión" aria-label="Cerrar sesión">
                        <i class="bi bi-box-arrow-right" ></i></button>
                </form>
            </div>

        </div>
    </header>

    <main class="contenedor-principal">

        <center>
            <h1 class="titulo-principal">Editar producto</h1>
        </center>

        <section class="formulario-general">

            <form method="post"
                  action="{% url 'editarProducto' producto.id_producto %}"
                  enctype="multipart/form-data">

                {% csrf_token %}

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label for="imagen" class="form-label">
                        Imagen del producto
                    </label>

                    {% if producto.imagen %}
                        <div class="mb-2">
                            <img src="{{ producto.imagen }}"
                                 alt="{{ producto.nombre }}"
                                 style="max-width: 150px; max-height: 150px;">
                        </div>
                    {% endif %}

                    <input type="file" id="imagen" name="imagen"
                           class="form-control" accept="image/*">
                </div>

                <div class="mb-3">
                    <label for="codigo" class="form-label">Código del producto</label>

                    <input type="text" id="codigo" name="codigo_producto"
                           class="form-control"
                           value="{{ producto.codigo_producto }}"
                           maxlength="20" required>
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del producto</label>

                    <input type="text" id="nombre" name="nombre"
                           class="form-control"
                           value="{{ producto.nombre }}"
                           maxlength="100" required>
                </div>

                <div class="mb-3">
                    <label for="categoria" class="form-label">Categoría</label>

                    <select id="categoria" name="categoria"
                            class="form-select" required>

                        {% for categoria in categorias %}
                            <option value="{{ categoria.id_categoria }}"
                                {% if categoria.id_categoria == producto.categoria.id_categoria %}selected{% endif %}>
                                {{ categoria.nombre }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>

                    <textarea id="descripcion" name="descripcion"
                              class="form-control"
                              rows="3" maxlength="255">{{ producto.descripcion }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="cantidad" class="form-label">Existencias actuales</label>

                    <input type="number" id="cantidad"
                           class="form-control"
                           value="{{ producto.cantidad }}" readonly>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label">Precio unitario</label>

                    <input type="number" id="precio" name="precio_unitario"
                           class="form-control"
                           value="{{ producto.precio_unitario }}"
                           min="0.01" step="0.01" required>
                </div>

                <div class="mb-3">
                    <label for="stockMinimo" class="form-label">Stock mínimo</label>

                    <input type="number" id="stockMinimo" name="stock_minimo"
                           class="form-control"
                           value="{{ producto.stock_minimo }}"
                           min="0" required>

                    <small class="text-muted">
                        Se generará una alerta cuando las existencias lleguen a este nivel.
                    </small>
                </div>

                <div class="d-flex justify-content-end gap-2">

                    <a href="{% url 'catalogoProducto' %}" class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-box-arrow-in-down"></i>
                        Guardar cambios
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
