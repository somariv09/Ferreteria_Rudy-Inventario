
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Categoría - Ferretería Rudy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="pagina">

    <header class="parte-superior">
        <div class="contenido-superior">

            <a href="{% url 'dashboard' %}" class="marca-ferreteria text-decoration-none text-white">
                <i class="bi bi-tools"></i>
                <span>FERRETERÍA RUDY</span>
            </a>

            <div class="usuario-sesion">
                <i class="bi bi-person-circle"></i>
                <span>{{ request.user.nombre }}</span>

                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="cerrar-sesion" title="Cerrar Sesión" aria-label="Cerrar sesión">
                        <i class="bi bi-box-arrow-right" ></i></button>
                </form>
            </div>

        </div>
    </header>

    <main class="contenedor-principal">

        <center>
            <h1 class="titulo-principal">Editar categoría</h1>
        </center>

        <section class="formulario-general">

            <form method="post"
                  action="{% url 'editarCategoria' categoria.id_categoria %}"
                  enctype="multipart/form-data">

                {% csrf_token %}

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label for="imagen" class="form-label">
                        Imagen de la categoría
                    </label>

                    {% if categoria.imagen %}
                        <div class="mb-2">
                            <img src="{{ categoria.imagen }}"
                                 alt="{{ categoria.nombre }}"
                                 style="max-width: 150px; max-height: 150px;">
                        </div>
                    {% endif %}

                    <input type="file" id="imagen" name="imagen"
                           class="form-control" accept="image/*">
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre de la categoría
                    </label>

                    <input type="text" id="nombre" name="nombre"
                           class="form-control"
                           value="{{ categoria.nombre }}"
                           maxlength="100" required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">
                        Descripción
                    </label>

                    <textarea id="descripcion" name="descripcion"
                              class="form-control"
                              rows="3" maxlength="255">{{ categoria.descripcion }}</textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">

                    <a href="{% url 'catalogoCategorias' %}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-box-arrow-in-down"></i>
                        Guardar cambios
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
