{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar movimiento - Ferretería Rudy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="pagina">

    <header class="parte-superior">
        <div class="contenido-superior">
            <a href="{% url 'dashboard' %}" class="marca-ferreteria text-decoration-none text-white">
                <i class="bi bi-tools"></i>
                <span>FERRETERÍA RUDY</span>
            </a>

            <div class="usuario-sesion">
                <i class="bi bi-person-circle"></i>
                <span>{{ request.user.nombre }}</span>

               <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="cerrar-sesion" title="Cerrar Sesión" aria-label="Cerrar sesión">
                        <i class="bi bi-box-arrow-right" ></i></button>
                </form>
            </div>
        </div>
    </header>

    <main class="contenedor-principal">

        <center>
            <h1 class="titulo-principal">Editar movimiento</h1>
        </center>

        <section class="formulario-movimiento">

            <form method="post"
                  action="{% url 'editarMovimiento' movimiento.id_movimiento %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="codigo" class="form-label">Código del producto</label>
                    <input type="text" id="codigo" class="form-control"
                           value="{{ movimiento.producto.codigo_producto }}" readonly>
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del producto</label>
                    <input type="text" id="nombre" class="form-control"
                           value="{{ movimiento.producto.nombre }}" readonly>
                </div>

                <div class="mb-3">
                    <label for="categoria" class="form-label">Categoría</label>
                    <input type="text" id="categoria" class="form-control"
                           value="{{ movimiento.producto.categoria.nombre }}" readonly>
                </div>

                <div class="mb-3">
                    <label for="cantidad" class="form-label">Cantidad</label>
                    <input type="number" id="cantidad" name="cantidad"
                           class="form-control" min="1"
                           value="{{ movimiento.cantidad }}" required>
                </div>

                <div class="mb-3">
                    <label for="tipoMovimiento" class="form-label">
                        Tipo de movimiento
                    </label>

                    <select id="tipoMovimiento" name="tipo_movimiento"
                            class="form-select" required>
                        <option value="ENTRADA"
                            {% if movimiento.tipo_movimiento == 'ENTRADA' %}selected{% endif %}>
                            Entrada
                        </option>

                        <option value="SALIDA"
                            {% if movimiento.tipo_movimiento == 'SALIDA' %}selected{% endif %}>
                            Salida
                        </option>
                    </select>
                </div>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'historial' %}" class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg"></i>
                        Guardar cambios
                    </button>
                </div>

            </form>

        </section>
    </main>

</body>
</html>
