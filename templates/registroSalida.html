{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salida de producto - Ferretería Rudy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="pagina">

    <header class="parte-superior">
        <div class="contenido-superior">
            <a href="{% url 'dashboard' %}" class="marca-ferreteria text-decoration-none text-white">
                <i class="bi bi-tools"></i>
                <span>FERRETERÍA RUDY</span>
            </a>

            <div class="usuario-sesion">
                <i class="bi bi-person-circle"></i>
                <span>{{ request.user.nombre }}</span>
                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="cerrar-sesion" title="Cerrar Sesión" aria-label="Cerrar sesión">
                        <i class="bi bi-box-arrow-right" ></i></button>
                </form>
            </div>
        </div>
    </header>

    <main class="contenedor-principal">

        <center>
            <h1 class="titulo-principal">Registrar salida</h1>
            <p class="descripcion-principal">
                Registra la salida de productos del inventario.
            </p>
        </center>

        <section class="formulario-general">

            <form method="post" action="{% url 'registroSalida' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="producto" class="form-label">Seleccionar producto</label>
                    <select id="producto" name="producto" class="form-select" required>
                        <option value="">Selecciona un producto</option>

                        {% for producto in productos %}
                        <option value="{{ producto.id_producto }}">
                            {{ producto.codigo_producto }} - {{ producto.nombre }} - 
                            (Disponible: {{ producto.cantidad }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="cantidad" class="form-label">Cantidad que sale</label>
                    <input type="number" id="cantidad" name="cantidad"
                        class="form-control" min="1"
                        placeholder="Ingresa la cantidad" required>
                </div>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-box-arrow-up"></i>
                        Registrar salida
                    </button>
                </div>

            </form>

        </section>
    </main>

</body>
</html>
